name: Cross-platform Build

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk cmake ninja-build git libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev g++-mingw-w64 pkg-config
      - name: Configure CMake
        run: cmake -G "Ninja" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ $GITHUB_WORKSPACE
      - name: Build
        run: ninja

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          choco install -y cmake ninja git openjdk11 mingw
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install sdl2 sdl2-image sdl2-ttf
      - name: Configure CMake (MinGW)
        run: |
          cmake -B build -G "Ninja" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_TOOLCHAIN_FILE=.\vcpkg\scripts\buildsystems\vcpkg.cmake
      - name: Build
        run: cmake --build build --parallel
